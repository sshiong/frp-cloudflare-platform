name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run golangci-lint (Server)
        uses: golangci/golangci-lint-action@v3
        with:
          working-directory: server-panel
          version: latest

      - name: Run golangci-lint (Client)
        uses: golangci/golangci-lint-action@v3
        with:
          working-directory: client-panel
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test Server Panel
        working-directory: server-panel
        run: go test ./... -v -race -count=1 -coverprofile=coverage.out

      - name: Test Client Panel
        working-directory: client-panel
        run: go test ./... -v -race -count=1 -coverprofile=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: server-panel/coverage.out,client-panel/coverage.out

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Server Frontend
        working-directory: server-panel/web-admin
        run: |
          npm ci
          npm run build

      - name: Build Client Frontend
        working-directory: client-panel/web-client
        run: |
          npm ci
          npm run build

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, build-frontend]
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Server Panel
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'linux' && '1' || '0' }}
        working-directory: server-panel
        run: |
          go build -trimpath -ldflags="-s -w" -o bin/frp-panel-server ./cmd/control/
          go build -trimpath -ldflags="-s -w" -o bin/frp-panel-server-router ./cmd/router/

      - name: Build Client Panel
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'linux' && '1' || '0' }}
        working-directory: client-panel
        run: go build -trimpath -ldflags="-s -w" -o bin/frp-panel-client ./cmd/client/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frp-panel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            server-panel/bin/
            client-panel/bin/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server-panel
          push: false
          tags: frp-panel-server:latest

      - name: Build Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client-panel
          push: false
          tags: frp-panel-client:latest
