# FRPS Configuration Template
# Generated by FRP Panel Server

[common]
# Server bind address
bind_addr = 0.0.0.0
# Server bind port for frpc connections
bind_port = 7000

# Virtual host HTTP port (only listen on localhost)
vhost_http_port = 8080
# Virtual host HTTPS port (not used for user domain certs)
# vhost_https_port = 0

# Dashboard (disabled by default)
# dashboard_addr = 127.0.0.1
# dashboard_port = 7500
# dashboard_user = admin
# dashboard_pwd =

# Authentication
# Token is managed by FRP Panel, do not edit manually
token = __FRP_TOKEN_PLACEHOLDER__

# Max pool count
max_pool_count = 10

# HTTP Plugin for authentication
[plugin.frp-panel]
addr = 127.0.0.1:9001
path = /internal/frp
ops = Login,NewProxy,NewWorkConn,NewUserConn,CloseProxy,Ping

# Logging
log_way = file
log_level = info
log_max_days = 7
