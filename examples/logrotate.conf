# FRP Panel 日志轮转配置
# 放置在 /etc/logrotate.d/frp-panel

/var/log/frp-panel/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 frp-panel frp-panel
    sharedscripts
    postrotate
        # 通知 FRP Panel 重新打开日志文件
        systemctl reload frp-panel-control || true
        systemctl reload frp-panel-router || true
    endscript
}

/var/log/frp-client-panel/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 frp-panel frp-panel
    sharedscripts
    postrotate
        systemctl reload frp-panel-client || true
    endscript
}
